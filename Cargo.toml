[workspace]
members = [
  "crates/reader-core",
  "crates/reader-formats",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
reader-core = { path = "crates/reader-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
unicode-general-category = "1"

# Format adapters
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
html5ever = "0.39"
markup5ever_rcdom = "0.39"
pdf-extract = "0.12"
lopdf = { version = "0.42", default-features = false }
sha2 = "0.11"
sha1 = "0.11"
md-5 = "0.11"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
